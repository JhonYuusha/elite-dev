services:
  postgres:
    image: postgres:16
    container_name: elite-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elite_dev
      POSTGRES_PASSWORD: elite_dev_password
      POSTGRES_DB: elite_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
